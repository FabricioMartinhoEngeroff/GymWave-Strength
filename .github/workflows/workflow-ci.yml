name: Workflow de Integração Contínua

on:
  pull_request:
    branches: [ "main" ]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npx tsc -b --noEmit
    - run: npm run test:run -- --coverage
    - run: npm audit --omit=dev --audit-level=high
    - name: Build de produção e verificação do bundle (sem mock de auth)
      run: |
        npm run build
        CHECK_DIST=1 npx vitest run src/__tests__/components/login/gateway/prodBundle.ci.spec.ts
